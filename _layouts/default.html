<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} – {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #fff;
      --text: #111;
      --text-heading: #000;
      --text-muted: #666;
      --text-subtle: #999;
      --border: #ddd;
      --border-subtle: #eee;
      --card-bg: #fff;
    }
    
    body.dark {
      --bg: #0d0d0d;
      --text: #ccc;
      --text-heading: #eee;
      --text-muted: #888;
      --text-subtle: #666;
      --border: #333;
      --border-subtle: #222;
      --card-bg: #1a1a1a;
    }
    
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
      padding: 3rem 1.5rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.3s, color 0.3s;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { 
      font-size: 2.5rem; 
      font-weight: 400; 
      letter-spacing: -0.02em; 
      margin-bottom: 0.5rem; 
      color: var(--text-heading); 
    }
    p { 
      color: var(--text-muted); 
      margin-bottom: 2rem; 
      font-size: 1.1rem;
      font-weight: 300;
    }
    a { color: var(--text); text-decoration: none; transition: opacity 0.2s; }
    a:hover { opacity: 0.6; }
    .sections { 
      display: flex; 
      gap: 2rem; 
      margin-top: 3rem;
    }
    .sections a {
      flex: 1; 
      display: block; 
      padding: 2rem 1.5rem; 
      text-align: left;
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      text-decoration: none; 
      color: var(--text); 
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    .sections a:hover { border-color: var(--text); opacity: 1; }
    .sections strong { 
      display: block; 
      font-size: 1.2rem; 
      font-weight: 400; 
      margin-bottom: 0.5rem; 
    }
    .sections small { 
      display: block; 
      color: var(--text-subtle); 
      font-size: 0.9rem; 
      font-weight: 300;
    }
    .card-list { 
      list-style: none; 
      display: flex; 
      flex-direction: column; 
      gap: 1rem; 
    }
    .card-list a {
      display: block; 
      padding: 1.5rem;
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      text-decoration: none; 
      color: var(--text); 
      transition: border-color 0.2s;
    }
    .card-list a:hover { border-color: var(--text); opacity: 1; }
    nav { 
      max-width: 720px; 
      margin: 0 auto 3rem; 
      display: flex; 
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem; 
      font-size: 0.9rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    nav a { color: var(--text); font-weight: 400; }
    nav a:hover { opacity: 0.6; }
    nav .sep { color: var(--border); }
    .theme-toggle {
      margin-left: auto;
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
      transition: border-color 0.2s, opacity 0.2s;
    }
    .theme-toggle:hover {
      opacity: 0.6;
    }
    @media (max-width: 640px) {
      body { padding: 2rem 1rem; }
      h1 { font-size: 2rem; }
      p { font-size: 1rem; }
      .sections { flex-direction: column; gap: 1rem; }
      nav { 
        gap: 1rem; 
        font-size: 0.85rem;
        padding-bottom: 1.5rem;
      }
      .theme-toggle {
        padding: 0.3rem 0.6rem;
        font-size: 0.8rem;
      }
    }
    @media (max-width: 400px) {
      body { padding: 1.5rem 0.75rem; }
      h1 { font-size: 1.75rem; }
      nav { gap: 0.75rem; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <main>
    <nav>
      <a href="/">photodialectic</a><span class="sep">/</span><a href="/game/">games</a><span class="sep">/</span><a href="https://www.nickhedberg.com" target="_blank" rel="noopener noreferrer">nhdc</a>
      <button class="theme-toggle" aria-label="Toggle theme">
        <span class="theme-toggle-light">dark</span>
        <span class="theme-toggle-dark" style="display:none;">light</span>
      </button>
    </nav>
    {{ content }}
  </main>
  <script>
    const toggle = document.querySelector('.theme-toggle');
    const lightLabel = document.querySelector('.theme-toggle-light');
    const darkLabel = document.querySelector('.theme-toggle-dark');
    
    function setTheme(theme) {
      document.body.classList.toggle('dark', theme === 'dark');
      lightLabel.style.display = theme === 'dark' ? 'none' : 'inline';
      darkLabel.style.display = theme === 'dark' ? 'inline' : 'none';
      localStorage.setItem('theme', theme);
    }
    
    const savedTheme = localStorage.getItem('theme');
    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    setTheme(savedTheme || systemTheme);
    
    toggle.addEventListener('click', () => {
      const currentTheme = document.body.classList.contains('dark') ? 'dark' : 'light';
      setTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });
    
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (!localStorage.getItem('theme')) {
        setTheme(e.matches ? 'dark' : 'light');
      }
    });
  </script>
</body>
</html>
